<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Team indonesia Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Silkscreen', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Latar Belakang Bintang */
        .star {
            position: absolute;
            color: #ffffff;
            user-select: none;
            pointer-events: none;
        }
        .s1 { top: 12%; left: 74%; font-size: 26px; }
        .s2 { top: 22%; left: 87%; font-size: 18px; }
        .s3 { top: 37%; left: 29%; font-size: 22px; }
        .s4 { top: 43%; left: 20%; font-size: 28px; }
        .s5 { top: 56%; left: 7%;  font-size: 20px; }
        .s6 { top: 71%; left: 9%;  font-size: 24px; }
        .s7 { top: 82%; left: 16%; font-size: 20px; }
        .s8 { top: 54%; left: 85%; font-size: 24px; }
        .s9 { top: 90%; left: 77%; font-size: 30px; }

        /* Kotak Utama */
        .container {
            background-color: #111111;
            border: 2px solid #333333;
            width: 440px;
            padding: 35px 28px;
            border-radius: 24px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Foto Profil */
        .profile-box {
            width: 150px;
            height: 150px;
            margin: 0 auto 22px auto;
        }
        .profile-box img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid #444444;
        }

        /* Judul */
        .title {
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        /* Subteks */
        .subtitle {
            color: #aaaaaa;
            font-size: 9px;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .support {
            color: #ffffff;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 22px;
        }

        /* Ikon Sosial Media */
        .socials {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .social-btn {
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .social-btn:hover {
            transform: scale(1.08);
        }
        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: #000000;
        }

        /* Tombol Link */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .btn {
            background-color: transparent;
            border: 1.5px solid #ffffff;
            color: #ffffff;
            padding: 12px 0;
            border-radius: 22px;
            font-family: 'Silkscreen', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-half {
            flex: 1;
        }
        .btn-full {
            width: 100%;
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            color: #666666;
            font-size: 8px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
